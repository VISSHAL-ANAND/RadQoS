name: Analyze completed Montgomery benchmark outputs

on:
  push:
    branches: [main]
    paths:
      - "analyze_results.py"
      - ".github/workflows/analyze-results.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy
      - name: Run quality control and publication statistics
        run: |
          python analyze_results.py --results-dir results --lossless-results-dir lossless-results --output-dir analysis-output
      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: publication-analysis-report
          path: analysis-output/
          if-no-files-found: error
          retention-days: 30
