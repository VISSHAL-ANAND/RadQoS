name: Analyze completed Montgomery benchmark outputs

on:
  push:
    branches: [publication-readiness]
    paths:
      - "analysis_trigger.txt"
      - "analyze_results.py"
      - ".github/workflows/analyze-results.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          path: analysis
      - name: Check out current main results
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy
      - name: Check whether the full primary results exist
        id: data
        shell: bash
        run: |
          required=(quality_by_image.csv delivery_by_image_profile.csv candidate_diagnostics.csv dataset_manifest.csv summary.csv paired_comparisons.csv monotonicity_diagnostics.csv run_metadata.json run.log)
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "main-repo/results/$f" ]; then
              echo "Missing primary output: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Run quality control and publication statistics
        if: steps.data.outputs.available == 'true'
        run: |
          python analysis/analyze_results.py --results-dir main-repo/results --output-dir analysis-output
      - name: Record pending state if results are not yet available
        if: steps.data.outputs.available != 'true'
        run: |
          mkdir -p analysis-output
          printf '# Publication analysis pending\n\nThe completed primary benchmark outputs are not yet all present on main. No statistical results were generated.\n' > analysis-output/quality_control_report.md
      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-analysis-report
          path: analysis-output/
          if-no-files-found: warn
          retention-days: 30
