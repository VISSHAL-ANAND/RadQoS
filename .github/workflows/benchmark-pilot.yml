name: Real-image compression pilot

on:
  push:
    branches: [benchmark-pilot]
    paths:
      - "benchmark_montgomery.py"
      - "requirements.txt"
      - ".github/workflows/benchmark-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run five-image real-data pilot
        env:
          MAX_IMAGES: "5"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf results
          mkdir -p results
          set -o pipefail
          python benchmark_montgomery.py 2>&1 | tee results/run.log

      - name: Upload pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-compression-pilot
          path: results/
          if-no-files-found: warn
          retention-days: 7
