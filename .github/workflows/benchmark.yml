name: Real-image compression benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmark.py"
      - "requirements.txt"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run real-image benchmark
        env:
          DATA_ROOT: data/MontgomerySet
          RESULTS_DIR: results
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p results
          set -o pipefail
          python benchmark.py 2>&1 | tee results/run.log

      - name: Publish run outputs and diagnostics to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Repository advanced after this run started; skipping publication from a stale source revision."
            exit 0
          fi
          git add -A results/ || true
          if git diff --cached --quiet; then
            echo "No run output to publish."
          else
            git commit -m "Publish benchmark run outputs and diagnostics [skip ci]"
            git push
          fi

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-compression-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
