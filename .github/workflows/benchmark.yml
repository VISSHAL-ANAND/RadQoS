name: Real-image compression benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmark.py"
      - "requirements.txt"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run real-image benchmark
        env:
          DATA_ROOT: data/MontgomerySet
          RESULTS_DIR: results
          PYTHONUNBUFFERED: "1"
        run: python benchmark.py

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-compression-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
