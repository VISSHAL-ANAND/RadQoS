name: Real-image compression benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmark_montgomery.py"
      - "requirements.txt"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run real-image benchmark
        env:
          MAX_IMAGES: "0"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf results
          mkdir -p results
          set -o pipefail
          python benchmark_montgomery.py 2>&1 | tee results/run.log

      - name: Publish run outputs and diagnostics to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD:benchmark_montgomery.py)" != "$(git rev-parse origin/main:benchmark_montgomery.py)" ] || [ "$(git rev-parse HEAD:requirements.txt)" != "$(git rev-parse origin/main:requirements.txt)" ]; then
            echo "Benchmark code or dependencies changed during this run; skipping stale results."
            exit 0
          fi
          mkdir -p /tmp/benchmark-results
          cp -a results/. /tmp/benchmark-results/ 2>/dev/null || true
          git reset --hard origin/main
          rm -rf results
          mkdir -p results
          cp -a /tmp/benchmark-results/. results/ 2>/dev/null || true
          git add -A results/
          if git diff --cached --quiet; then
            echo "No run output to publish."
          else
            git commit -m "Publish benchmark run outputs and diagnostics [skip ci]"
            git push
          fi

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-compression-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
