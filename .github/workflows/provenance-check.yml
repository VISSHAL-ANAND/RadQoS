name: Verify Montgomery source provenance

on:
  push:
    branches: [provenance-check]
    paths:
      - ".github/workflows/provenance-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image inspection dependency
        run: python -m pip install --upgrade pip Pillow numpy

      - name: Compare official NLM and Hugging Face image and mask bytes
        run: |
          python - <<'PY'
          import csv, hashlib, json, struct, urllib.request, io, re
          from pathlib import Path
          import numpy as np
          from PIL import Image

          names = [
              "MCUCXR_0017_0.png",
              "MCUCXR_0080_0.png",
              "MCUCXR_0081_0.png",
              "MCUCXR_0150_1.png",
              "MCUCXR_0243_1.png",
          ]
          base_official = "https://data.lhncbc.nlm.nih.gov/public/Tuberculosis-Chest-X-ray-Datasets/Montgomery-County-CXR-Set/MontgomerySet/"
          base_hf = "https://huggingface.co/datasets/Famatsu123/montgomery-shenzhen-tuberculosis-cxr/resolve/main/MontgomerySet/"
          objects = [(name, "CXR_png") for name in names]
          objects += [(name, f"ManualMask/{side}Mask") for name in names for side in ("left", "right")]
          out = Path("provenance-results")
          out.mkdir(exist_ok=True)

          def download(url):
              req = urllib.request.Request(url, headers={"User-Agent": "CXR-Compression-Provenance-Check/1.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read(), response.geturl()

          def inspect(blob):
              if blob[:8] != b"\x89PNG\r\n\x1a\n" or blob[12:16] != b"IHDR":
                  raise RuntimeError("Downloaded content is not a standard PNG IHDR")
              width, height = struct.unpack(">II", blob[16:24])
              bit_depth, color_type = blob[24], blob[25]
              with Image.open(io.BytesIO(blob)) as im:
                  im.load()
                  arr = np.asarray(im)
                  mode = im.mode
              return {
                  "width": width, "height": height,
                  "png_ihdr_bit_depth": bit_depth, "png_color_type": color_type,
                  "pillow_mode": mode, "numpy_dtype": str(arr.dtype),
                  "sample_min": int(arr.min()), "sample_max": int(arr.max()),
                  "n_unique_sample_values": int(np.unique(arr).size),
              }

          rows = []
          for name, rel_dir in objects:
              row = {"filename": name, "object_type": "image" if rel_dir == "CXR_png" else rel_dir}
              blobs = {}
              for label, root in [("official_nlm", base_official), ("huggingface", base_hf)]:
                  blob, resolved = download(root + rel_dir + "/" + name + "?download=true")
                  blobs[label] = blob
                  details = inspect(blob)
                  row[f"{label}_url"] = resolved
                  row[f"{label}_bytes"] = len(blob)
                  row[f"{label}_sha256"] = hashlib.sha256(blob).hexdigest()
                  for key, value in details.items():
                      row[f"{label}_{key}"] = value
              row["byte_identical"] = blobs["official_nlm"] == blobs["huggingface"]
              rows.append(row)
              print(json.dumps({k:v for k,v in row.items() if not k.endswith("_url")}, sort_keys=True))
          with (out / "source_comparison.csv").open("w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)

          # Inspect the PNG headers for the complete official collection using
          # byte-range reads, without downloading all image payloads again.
          index_blob, _ = download(base_official + "CXR_png/index.html")
          index_text = index_blob.decode("utf-8", errors="replace")
          image_names = sorted(set(re.findall(r"MCUCXR_[A-Za-z0-9_]+\.png", index_text)))
          if len(image_names) != 138:
              raise RuntimeError(f"Expected 138 radiograph links in official NLM index, found {len(image_names)}")
          header_rows = []
          for filename in image_names:
              url = base_official + "CXR_png/" + filename
              req = urllib.request.Request(url, headers={
                  "User-Agent": "CXR-Compression-Provenance-Check/1.0",
                  "Range": "bytes=0-25",
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  header = response.read(26)
                  status = getattr(response, "status", None)
                  content_range = response.headers.get("Content-Range", "")
              if len(header) < 26 or header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
                  raise RuntimeError(f"Invalid or incomplete PNG IHDR header for {filename}; HTTP {status}, bytes={len(header)}")
              width, height = struct.unpack(">II", header[16:24])
              row = {
                  "filename": filename, "width": width, "height": height,
                  "png_ihdr_bit_depth": header[24], "png_color_type": header[25],
                  "range_request_http_status": status, "content_range": content_range,
                  "header_bytes_read": len(header),
              }
              header_rows.append(row)
          with (out / "all_image_headers.csv").open("w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(header_rows[0].keys()))
              writer.writeheader()
              writer.writerows(header_rows)
          print("Full-set image-header audit: " + json.dumps({
              "n_images": len(header_rows),
              "bit_depth_counts": {str(k): sum(r["png_ihdr_bit_depth"] == k for r in header_rows) for k in sorted({r["png_ihdr_bit_depth"] for r in header_rows})},
              "dimension_counts": {str((w,h)): sum((r["width"],r["height"]) == (w,h) for r in header_rows) for w,h in sorted({(r["width"],r["height"]) for r in header_rows})},
          }, sort_keys=True), flush=True)

          images = [r for r in rows if r["object_type"] == "image"]
          masks = [r for r in rows if r["object_type"] != "image"]
          report = {
              "n_images_checked_for_exact_hash": len(images),
              "n_left_right_masks_checked_for_exact_hash": len(masks),
              "n_official_collection_image_headers_checked": len(header_rows),
              "full_collection_png_bit_depth_counts": {str(k): sum(r["png_ihdr_bit_depth"] == k for r in header_rows) for k in sorted({r["png_ihdr_bit_depth"] for r in header_rows})},
              "full_collection_dimension_counts": {str((w,h)): sum((r["width"],r["height"]) == (w,h) for r in header_rows) for w,h in sorted({(r["width"],r["height"]) for r in header_rows})},
              "images_all_byte_identical": all(r["byte_identical"] for r in images),
              "masks_all_byte_identical": all(r["byte_identical"] for r in masks),
              "all_15_objects_byte_identical": all(r["byte_identical"] for r in rows),
              "official_image_png_bit_depths": sorted({r["official_nlm_png_ihdr_bit_depth"] for r in images}),
              "hf_image_png_bit_depths": sorted({r["huggingface_png_ihdr_bit_depth"] for r in images}),
              "official_mask_png_bit_depths": sorted({r["official_nlm_png_ihdr_bit_depth"] for r in masks}),
              "hf_mask_png_bit_depths": sorted({r["huggingface_png_ihdr_bit_depth"] for r in masks}),
              "limitations": [
                  "Checks five images and their ten masks, not the complete 138-image collection.",
                  "Matching hashes establish byte identity only for these selected files.",
                  "PNG header bit depth and Pillow decoded dtype are reported independently."
              ]
          }
          (out / "provenance_summary.json").write_text(json.dumps(report, indent=2))
          print("\nSUMMARY\n" + json.dumps(report, indent=2))
          if len(rows) != 15 or not report["all_15_objects_byte_identical"]:
              raise SystemExit("Expected 15 byte-identical official/mirror objects")
          if len(header_rows) != 138:
              raise SystemExit("Expected all 138 official image headers")
          PY

      - name: Upload provenance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-source-provenance
          path: provenance-results/
          if-no-files-found: error
          retention-days: 30
