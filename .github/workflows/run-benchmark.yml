name: Legacy sampled benchmark (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run legacy sampled benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          MAX_IMAGES: "30"
        run: python benchmark_montgomery.py
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-sampled-benchmark-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
